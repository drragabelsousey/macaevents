backend:
  name: github
  repo: drragabelsousey/macaevents
  branch: main

locale: ar
media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "site"
    label: "محتوى موقع MACA"
    files:
      - name: "homepage"
        label: "الصفحة الرئيسية"
        file: "content/site.json"
        format: "json"
        fields:
          - {label: "العنوان الرئيسي - السطر الأول", name: "hero_title", widget: "string"}
          - {label: "العنوان الرئيسي الذهبي", name: "hero_highlight", widget: "string"}
          - {label: "وصف البداية", name: "hero_text", widget: "text"}
          - {label: "عنوان من نحن", name: "about_title", widget: "string"}
          - {label: "نص من نحن", name: "about_text", widget: "text"}
          - {label: "عنوان الخدمات", name: "services_title", widget: "string"}
          - {label: "عنوان أعمالنا", name: "work_title", widget: "string"}
          - {label: "وصف أعمالنا", name: "work_text", widget: "text"}
          - {label: "اسم المؤسس", name: "founder_name", widget: "string"}
          - {label: "نبذة المؤسس", name: "founder_text", widget: "text"}
          - {label: "كلمة المؤسس", name: "founder_quote", widget: "text"}
          - {label: "عنوان التواصل", name: "contact_title", widget: "string"}
          - {label: "نص التواصل", name: "contact_text", widget: "text"}
          - {label: "الهاتف الأول", name: "phone1", widget: "string"}
          - {label: "الهاتف الثاني", name: "phone2", widget: "string"}
          - {label: "البريد الإلكتروني", name: "email", widget: "string"}
          - {label: "رابط Facebook", name: "facebook", widget: "string"}
          - {label: "رقم WhatsApp بصيغة دولية", name: "whatsapp", widget: "string", hint: "مثال: 201555078732"}
